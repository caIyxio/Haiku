name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project Haiku.xcodeproj \
            -scheme Haiku \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Haiku.app Payload/Haiku.app
          /usr/bin/zip -qry Haiku.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Haiku-iOS-IPA
          path: Haiku.ipa
          if-no-files-found: error
